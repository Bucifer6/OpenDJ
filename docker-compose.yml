# Example: OpenDJ on a NAS / home server. Start with `docker compose up -d`, then open http://<server>:7380
# (put a TLS reverse proxy in front for MIDI controllers and remote access; see README "Run as a web app / on a NAS").
services:
  opendj:
    build: .
    image: opendj:latest
    container_name: opendj
    restart: unless-stopped
    ports:
      - "7380:7380"
    environment:
      # Login password. Not set here on purpose: on the first visit you choose one with the one-time setup code
      # printed in `docker logs opendj`. To fix it instead, set OPENDJ_PASSWORD in a `.env` file next to this file
      # (8+ characters; example values like "change-me" are refused at startup) and uncomment:
      # OPENDJ_PASSWORD: "${OPENDJ_PASSWORD}"
      # Several music folders: mount each one and list them separated by ':'.
      OPENDJ_MUSIC_ROOTS: "/music"
      # Behind a reverse proxy that sets X-Forwarded-For / X-Forwarded-Proto (Caddy, nginx, Traefik): its address,
      # or "1" to trust whatever connects (then OpenDJ must only be reachable through the proxy):
      # OPENDJ_TRUST_PROXY: "172.18.0.1"
      # Only answer to these host names (optional, recommended when exposed):
      # OPENDJ_ALLOWED_HOSTS: "dj.example.com"
    volumes:
      - opendj-data:/data          # library, analysis cache, transcode cache, uploads
      - /path/to/your/music:/music:ro
    # Run as your NAS user so uploads/downloads are owned by you (and /music can be read):
    # user: "1000:1000"

volumes:
  opendj-data:
