<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob: mediastream:; frame-src https://www.youtube-nocookie.com https://www.youtube.com">
  <title>OpenDJ Video Output</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/video.css">
</head>
<body class="vid-out-body">
  <div class="vid-out-stage" id="stage">
    <video id="out" muted autoplay playsinline disablepictureinpicture></video>
    <div class="vid-out-yt" id="yt"></div>
  </div>
  <div class="vid-out-bar" id="bar">
    <span class="vid-out-title">OpenDJ · Video output</span>
    <span class="vid-out-status" id="status">Connecting…</span>
    <button class="vid-out-btn" id="fs" type="button" title="Full screen (F or double-click)">⛶ Full screen</button>
  </div>
  <div class="vid-out-click" id="clickfs" hidden>Click anywhere to go full screen</div>
  <script type="module" src="js/video/output-page.js"></script>
</body>
</html>
