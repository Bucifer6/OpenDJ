name: Build desktop apps

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

# least privilege: only the release job can write
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build web-app image (not pushed)
        run: docker build -t opendj:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name opendj -p 7380:7380 -e OPENDJ_PASSWORD=ci-password opendj:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' opendj)" = healthy ] && break
            curl -fsS http://127.0.0.1:7380/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:7380/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7380/api/tracks)" = 401
          docker logs opendj
          docker rm -f opendj

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          # Ubuntu 24.04 (rpm 4.x): electron-builder's fpm can't build .rpm with rpm 6 on newer runners
          - os: ubuntu-24.04
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds; add signing certificates as secrets to sign them.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build .rpm (Fedora/openSUSE; optional)
        if: runner.os == 'Linux'
        run: |
          if ! npx electron-builder --linux rpm --x64 --publish never > rpm-build.log 2>&1; then
            echo "::warning::rpm build failed (release continues without .rpm)"
            tail -n 80 rpm-build.log
          fi
          ls -la dist/*.rpm || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenDJ-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          body_path: docs/RELEASE_NOTES.md
          generate_release_notes: true
          # manual runs create the tag on the commit that was built
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: OpenDJ ${{ inputs.release_tag || github.ref_name }}
