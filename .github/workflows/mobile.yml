name: Build mobile apps

# Android: release APK + AAB (signed with the release keystore from secrets, else debug-signed so the APK still installs).
# iOS: unsigned simulator build to prove it compiles; signed archive + TestFlight upload only when the Apple secrets exist.
# Secrets that are set but unusable (not base64, wrong password, placeholder text) give a warning and the unsigned /
# debug-signed build instead of a failed run. Tag pushes (v*) attach the APK to that tag's GitHub Release.
# Signing secrets are environment secrets of `release`: only tag pushes (v*) and manual runs with release_tag use it.
# Required secrets: see docs/MOBILE.md ("CI secrets").
on:
  push:
    branches: [main, mobile, 'claude/**']
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach the Android APK to the GitHub Release with this tag (e.g. v0.4.1). Leave empty to only build.'
        required: false
        default: ''

# least privilege: only the release job can write
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - name: Vendor bundle is up to date
        run: node scripts/build-vendor.mjs --check

  android:
    needs: web
    runs-on: ubuntu-latest
    # Signing keys live in the protected `release` environment (approval required; tags v* and main only).
    # Other runs (pull requests, branch pushes) get no secrets and build debug-signed / unsigned.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && 'release' || '' }}
    env:
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Capacitor 8 needs JDK 21; the Android SDK comes preinstalled on GitHub's Ubuntu runners
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Copy the web app into the Android project (npx cap sync android)
        run: node scripts/mobile-sync.mjs android
      - name: Release keystore
        if: env.HAVE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # only a keystore that decodes and opens with its password and alias is used (Gradle signs with it when
          # ANDROID_KEYSTORE_FILE is set); anything else falls back to the debug key with a warning
          ks="$RUNNER_TEMP/release.keystore"
          if printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ks" 2>/dev/null \
             && keytool -list -keystore "$ks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "ANDROID_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
            echo "KEYSTORE_OK=true" >> "$GITHUB_ENV"
          else
            rm -f "$ks"
            echo "::warning::The Android signing secrets are set but unusable (ANDROID_KEYSTORE_BASE64 must be base64 of the .jks; the password and alias must open it). Building with the debug key instead. See docs/MOBILE.md, CI and secrets."
          fi
      - name: Build APK + AAB
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Name the outputs
        run: |
          v=$(node -p "require('./package.json').version")
          kind=$([ "$KEYSTORE_OK" = true ] && echo release || echo debug-signed)
          mkdir -p dist-mobile
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "dist-mobile/OpenDJ-$v-android-$kind.apk"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "dist-mobile/OpenDJ-$v-android-$kind.aab"
          [ "$KEYSTORE_OK" = true ] || echo "::warning::No usable release keystore: the APK is signed with the debug key (fine for testing, not for Google Play)."
          ls -la dist-mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenDJ-Android
          if-no-files-found: error
          path: dist-mobile/*

  ios:
    needs: web
    runs-on: macos-latest
    # Signing keys live in the protected `release` environment (approval required; tags v* and main only).
    # Other runs (pull requests, branch pushes) get no secrets and build debug-signed / unsigned.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && 'release' || '' }}
    env:
      HAVE_APPLE: ${{ secrets.APPLE_TEAM_ID != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' && secrets.APP_STORE_CONNECT_API_KEY_ID != '' && secrets.APP_STORE_CONNECT_API_ISSUER_ID != '' && secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Copy the web app into the iOS project (npx cap sync ios)
        run: node scripts/mobile-sync.mjs ios
      - name: Build for the simulator (unsigned)
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          test "${PIPESTATUS[0]}" = 0
      # ---- signed archive + TestFlight (only with the Apple secrets) ----
      - name: Signing keychain + provisioning profile
        if: env.HAVE_APPLE == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # unusable Apple secrets (not base64, wrong password, placeholder text): warn and keep the unsigned build
          unusable() {
            echo "::warning::The iOS signing secrets are set but unusable ($1). Skipping the signed archive and TestFlight upload. See docs/MOBILE.md, CI and secrets."
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" > /dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
            exit 0
          }
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12" 2>/dev/null || unusable "IOS_DIST_CERT_P12_BASE64 is not base64"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision" 2>/dev/null || unusable "IOS_PROVISIONING_PROFILE_BASE64 is not base64"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist" 2>/dev/null || unusable "the provisioning profile does not decode"
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC" || unusable "the .p12 certificate or its password"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APPLE_OK=true" >> "$GITHUB_ENV"
      - name: Archive + export IPA
        if: env.APPLE_OK == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # manual signing for the App target only (signing flags on the command line would also hit the Swift packages)
          perl -0pi -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g; s/(PRODUCT_BUNDLE_IDENTIFIER = io\.github\.bucifer6\.opendj;)/$1\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{APPLE_TEAM_ID};\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{PROFILE_NAME}";/g' mobile/ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OpenDJ.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -n 40
          test "${PIPESTATUS[0]}" = 0
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>io.github.bucifer6.opendj</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OpenDJ.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"
      - name: Upload to TestFlight
        if: env.APPLE_OK == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          xcrun altool --upload-app --type ios --file "$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -n 1)" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
      - name: Clean up signing material
        if: always() && env.HAVE_APPLE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"

  release-android:
    # a tag push (the desktop workflow creates that tag's release) or Run workflow with release_tag
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenDJ-Android
          path: artifacts
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # the desktop workflow publishes the release for a tag push: wait for it (up to an hour) rather than
          # creating a release of our own with only the APK
          for i in $(seq 1 120); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            [ "$i" = 120 ] && { echo "::error::No GitHub Release for $TAG after an hour"; exit 1; }
            sleep 30
          done
          # The desktop job creates the checksum manifest. Include the later Android upload in it too.
          # A release can exist before all desktop assets have finished uploading.
          for i in $(seq 1 60); do
            gh release download "$TAG" --pattern SHA256SUMS.txt --dir artifacts --clobber --repo "$GITHUB_REPOSITORY" && break
            [ "$i" = 60 ] && { echo "::error::No desktop checksum manifest for $TAG"; exit 1; }
            sleep 5
          done
          # Reruns replace previous APK hashes instead of leaving conflicting entries.
          awk '$2 !~ /^OpenDJ-.*-android-.*[.]apk$/' artifacts/SHA256SUMS.txt > artifacts/SHA256SUMS.desktop.txt
          mv artifacts/SHA256SUMS.desktop.txt artifacts/SHA256SUMS.txt
          (cd artifacts && sha256sum *.apk >> SHA256SUMS.txt)
          gh release upload "$TAG" artifacts/*.apk artifacts/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
